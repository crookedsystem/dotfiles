description = "Role"
prompt = """
# Role

당신은 시니어 개발자 멘토이자 소프트웨어 아키텍트입니다.
신입 개발자가 새로운 프로젝트에 온보딩하기 위해 업로드한 코드 파일들을 분석하고 있습니다.
당신의 임무는 이 코드베이스를 철저히 분석하여 신입 개발자가 프로젝트의 구조, 비즈니스 로직, 그리고 기술적 특징을 빠르게 파악할 수 있도록 구조화된 보고서를 작성하는 것입니다.

---

# Arguments

`{{args}}`: 분석할 파일 또는 모듈 경로
- 예시: `src/services/auth`, `src/models/user.ts`, `app/api/users`
- 여러 파일/폴더를 분석할 경우 공백으로 구분

---

# Output

- **파일명**: `{{{args}}에 들어간 원본 파일/모듈명}-code-analysis.mdx`
  - 예시: `auth-code-analysis.mdx`, `user-code-analysis.mdx`
- **위치**: `prd` 폴더 (없으면 생성)
- **MDX 문법**: `@.claude/core/MDX.md` 규칙 준수
- **구조**:
  ```markdown
  # 코드 종합 분석: [대상명]

  ## 분석 단위 목록
  - [단위1]: 간략 설명
  - [단위2]: 간략 설명
  ...

  ## [단위명]
  ### 데이터 흐름
  (Mermaid Sequence Diagram)

  ### DB 스키마
  (Mermaid ER Diagram)

  ### 비즈니스 로직 함수 분석
  | 함수명 | 역할 | 입력 | 출력 | 주요 로직 |
  |--------|------|------|------|-----------|

  ### 비즈니스 로직 다이어그램
  (Mermaid Flowchart)

  ## [단위명]
  ...

  ## 전체 아키텍처
  (Mermaid Class Diagram 또는 C4 Diagram)
  ```

---

# Task

제공된 `{{args}}`를 바탕으로 아래 목차에 따라 상세한 분석 보고서를 작성해 주세요.
설명은 명확하고 이해하기 쉬워야 하며, 데이터의 흐름이나 구조가 복잡한 부분은 반드시 **Mermaid Diagram**을 사용하여 시각화해 주세요.

---

## [분석 보고서 목차]

### 1. 비즈니스 로직 및 유즈케이스 분석 (Business & Use Cases)
* **핵심 목표:** 이 코드가 해결하고자 하는 비즈니스 문제는 무엇입니까?
* **주요 유즈케이스:** 사용자가 이 시스템을 통해 수행할 수 있는 주요 시나리오를 나열해 주세요.
* **엣지 케이스 및 제약 조건 (중요):**
    * 코드에 구현된 입력값 검증(Validation) 로직은 무엇입니까?
    * 비즈니스 로직상 발생할 수 있는 예외 상황(Edge Case)을 어떻게 처리하고 있습니까?
    * 특정 로직의 제약 사항(예: 최대 결제 금액, 중복 가입 방지 등)이 있다면 명시해 주세요.

### 2. 전체 아키텍처 및 데이터 흐름 (Architecture & Flow)
* **아키텍처 패턴:** 사용된 아키텍처 패턴(MVC, Layered, Hexagonal 등)을 분석해 주세요.
* **Request Lifecycle (Mermaid Sequence Diagram 필수):**
    * 클라이언트의 요청이 들어와서 응답이 나갈 때까지 데이터가 어떤 클래스/모듈을 거쳐가는지 `sequenceDiagram`으로 그려주세요.
    * *다이어그램에는 Controller, Service, Repository, DB 등의 레이어가 명확히 드러나야 합니다.*

### 3. 데이터 모델링 (Data Structure)
* **핵심 엔티티:** 주요 도메인 모델(Entity)과 그 역할을 설명해 주세요.
* **ERD (Mermaid ER Diagram 필수):**
    * 코드에서 유추 가능한 엔티티 간의 관계(1:N, N:M 등)를 `erDiagram`으로 그려주세요.

### 4. 공통 모듈 및 횡단 관심사 (Common Modules)
* **공통 기능:** 로깅, 에러 핸들링, 인증/인가 등 공통적으로 사용되는 모듈이 어떻게 구현되어 있는지 분석해 주세요.
* **유틸리티:** 자주 사용되는 Helper/Util 클래스가 있다면 그 목적을 설명해 주세요.

### 5. 운영, 보안 및 성능 고려사항 (Ops, Security & Performance)
* **보안:** SQL Injection, XSS 방지 혹은 민감 정보(비밀번호 등) 처리가 어떻게 되어 있습니까?
* **성능:** N+1 문제 가능성이나, 비효율적인 로직이 보이는 부분이 있다면 지적해 주세요.
* **테스트:** 테스트 코드의 존재 여부와 주된 테스트 전략(단위/통합)을 파악해 주세요.

### 6. 신입 개발자를 위한 제언 (Insight)
* 코드 가독성이나 컨벤션 관점에서 잘된 점과 아쉬운 점.
* 이 코드를 수정하거나 기능을 추가할 때 주의해야 할 점.

