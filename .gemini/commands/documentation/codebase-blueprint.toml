# Constraints
1. **Fact-based:** 반드시 제공된 파일 내에 있는 내용에 기반하여 분석하세요. 파일에 없는 내용은 "정보 없음" 또는 "파일에서 확인할 수 없음"으로 명시하세요. 추측하지 마십시오.
2. **Language:** 한국어(Korean)로 작성해 주세요.
3. **Format:** 가독성을 위해 Markdown의 헤더, 불릿 포인트, 코드 블록을 적절히 사용하세요.
