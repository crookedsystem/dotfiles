## 5. 화면 흐름 (Screen Flow)

### 5.1 화면 전환 다이어그램

```mermaid
flowchart TD
    subgraph CurrentScreen["📱 현재 화면"]
        A[진입] --> B{조건 확인}
        B -->|조건1| C[액션1 수행]
        B -->|조건2| D[액션2 수행]
        C --> E[결과 처리]
        D --> E
    end
    
    E -->|성공| F["🔗 다음 화면 A"]
    E -->|실패| G["🔗 에러 화면"]
    E -->|취소| H["🔗 이전 화면"]
    
    style CurrentScreen fill:#e3f2fd
    style F fill:#c8e6c9
    style G fill:#ffcdd2
    style H fill:#fff9c4
```

### 5.2 네비게이션 규칙

| 출발 | 도착 | 조건 | 전환 효과 |
|------|------|------|----------|
| [현재 화면] | [다음 화면] | [조건] | [Push/Modal/Replace] |

---

## 6. 상태 관리 (States)

### 6.1 화면 상태 다이어그램

```mermaid
stateDiagram-v2
    [*] --> Initial: 화면 진입
    
    Initial --> Loading: 데이터 요청
    Loading --> Success: 응답 성공
    Loading --> Error: 응답 실패
    
    Success --> Editing: 편집 시작
    Editing --> Saving: 저장 요청
    Saving --> Success: 저장 완료
    Saving --> Error: 저장 실패
    
    Error --> Loading: 재시도
    Success --> [*]: 화면 이탈
```

### 6.2 상태별 UI

| 상태 | UI 표시 | 사용자 액션 가능 여부 |
|------|--------|---------------------|
| Initial | 스켈레톤 UI | X |
| Loading | 로딩 스피너 | X |
| Success | 데이터 표시 | O |
| Error | 에러 메시지 + 재시도 버튼 | 재시도만 |
| Empty | 빈 상태 안내 | 일부 액션 |

