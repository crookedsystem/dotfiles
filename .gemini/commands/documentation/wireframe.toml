# 작업 프로세스

1. **요구사항 분석**: {{args}}에서 화면 목적, 기능, 사용자 추출
2. **파일명 결정**: 핵심 기능을 영어 kebab-case로 변환
3. **레이아웃 설계**: Desktop/Mobile 각각의 와이어프레임 작성
4. **컴포넌트 식별**: 모든 UI 요소 정의 및 명세
5. **인터랙션 정의**: 모든 사용자 액션과 결과 매핑
6. **흐름도 작성**: Mermaid로 화면 전환 및 상태 다이어그램 생성
7. **검증**: 품질 체크리스트 확인

