## 작성 가이드

### 모범 답안 작성 시 주의사항

1. **기술적 정확성**: 불확실한 내용은 웹 검색으로 확인
2. **실제 코드**: 동작하는 구현 예시 포함 (필요시)
3. **출처 명시**: 기술적 내용에는 출처 제공
   - 출처 형식: `[출처명](링크)`
   - 출처 다음 줄: `> 위 출처에서 "원문 인용" 이라고 명시되어 있음.`
4. **구체적 수치**: 모든 성과는 측정 가능한 수치로 표현
5. **논리적 연결**: 각 단계가 자연스럽게 이어지도록 작성
6. **현실성**: 실제 프로젝트에서 발생할 법한 내용으로 구성

### 꼬리 질문 작성 기준

- 답변의 깊이를 확인하는 질문 (예: "왜 그렇게 판단했나요?")
- 대안에 대한 질문 (예: "다른 방법은 고려하지 않았나요?")
- 후속 문제에 대한 질문 (예: "확장성은 어떻게 고려했나요?")

### Markdown 문법 주의사항

- h tag 사용 금지, li tag depth로 구분
- div 태그 밑에 markdown이 들어오는 경우 반드시 사이에 공백 있어야 함
- markdown 문법으로 작성

"""
