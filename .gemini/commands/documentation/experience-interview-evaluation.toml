description = "면접 답변 평가 및 모범 답안 생성"
prompt = """
# 면접 답변 평가 및 모범 답안 생성

`{{args}}`로 제공된 질문과 답변을 '선택의 흐름' 5단계 기준으로 평가하고 모범 답안을 생성해줘.

## 평가 기준: '선택의 흐름' 5단계

### 1장: 문제의 발견 (Problem)

**핵심 질문:**
- 어떤 문제가 있었나?
- 왜 이게 문제인가? (비즈니스 임팩트)
- 어떻게 발견했나? (측정)

**예시:**

❌ **나쁜 답변:** "성능이 안 좋았습니다."
- 무엇이? 얼마나? 왜 문제인지 불명확

✅ **좋은 답변:** "상품 조회 API가 응답시간 **P95 기준 800ms**로 측정되었습니다.
- **비즈니스 임팩트:** 피크 시간대(저녁 8-10시) timeout 에러 5% 발생, 예상 매출 손실 월 1억원
- **측정 방법:** Datadog APM 알람으로 첫 인지, Sentry에서 timeout 에러 급증 확인"

### 2장: 선택지 탐색 (Options)

**핵심 질문:**
- 어떤 해결 방법들을 고려했나?
- 각 방법의 장단점은?
- 왜 이 3가지로 좁혔na?

**예시:**

❌ **나쁜 답변:** "Redis로 캐싱하기로 했습니다."
- 다른 방법은? 왜 하필 Redis?

✅ **좋은 답변:** "3가지 해결 방안을 검토했습니다.
- **Option 1: DB 쿼리 최적화**
  - 예상: 800ms → 200ms
  - 장점: 추가 비용 없음
  - 단점: 목표(100ms) 미달

- **Option 2: Redis 캐싱**
  - 예상: 800ms → 15ms (캐시 히트 시)
  - 장점: 극적 성능 개선, 확장성
  - 단점: 월 30만원 비용, 캐시 정합성 관리 필요

- **Option 3: CDN**
  - 예상: 10ms
  - 장점: 가장 빠름
  - 단점: 동적 데이터(재고) 부적합, 비용 높음"

### 3장: 결정의 근거 (Decision)

**핵심 질문:**
- 왜 이 방법을 최종 선택했na?
- 무엇을 우선순위로 뒀na? (비용, 성능, UX, 팀 역량)
- 팀과 어떻게 합의했na?

**예시:**

❌ **나쁜 답변:** "Redis가 빠르니까 선택했습니다."
- 왜 빠른게 중요? 의사결정 과정은?

✅ **좋은 답변:** "**Option 2: Redis 캐싱**을 선택했습니다.
- **결정 근거:**
  1. 비즈니스 우선순위: 목표 응답시간 100ms 이하 달성은 Option 2가 유일
  2. 데이터 특성: 트래픽의 80%가 상위 20% 상품에 몰려 캐싱 효율 높음
  3. 팀 역량: 팀원 3명이 Redis 운영 경험 보유
- **팀 합의:** 3가지 옵션을 문서화하여 백엔드/인프라/PM과 리뷰, Redis 장애 시 DB Fallback 전략 합의"

### 4장: 구현의 여정 (Action)

**핵심 질문:**
- 어떻게 구현했na? (디테일)
- 어떤 문제를 만났na?
- 그 문제를 어떻게 해결했na?

**예시:**

❌ **나쁜 답변:** "Redis를 설치하고 적용했습니다."
- 어떻게? 전략은? 문제는 없었na?

✅ **좋은 답변:** "구현은 3단계로 진행했습니다.
- **아키텍처:** Redis Cluster (Master 3, Replica 3) 구성 - 고가용성 확보
- **캐싱 전략:**
  - Key 설계: `product:{id}:{version}` (version으로 무효화 제어)
  - TTL: 5분 (상품 정보 평균 수정 주기 분석 결과)
- **만난 문제:**
  - 문제 1: 배포 직후 Cache Miss 폭증 → Cache Warming 스크립트 작성 (인기 상품 1만 개 미리 로딩)
  - 문제 2: Redis 메모리 부족 → maxmemory-policy를 allkeys-lru로 변경
  - 문제 3: Redis 장애 대비 → Circuit Breaker 패턴 적용 (Resilience4j)"

### 5장: 결과와 학습 (Result)

**핵심 질문:**
- 어떤 결과를 만들었na? (수치!)
- 무엇을 배웠na? (회고)
- 다시 한다면 어떻게 개선하겠na?

**예시:**

❌ **나쁜 답변:** "성능이 많이 개선되었습니다. 사용자들이 만족했습니다."
- 얼마na? 어떻게 측정했는데?

✅ **좋은 답변:** "측정 가능한 성과를 달성했습니다.
- **성능 지표:**
  - 응답시간 (P95): 800ms → 250ms (68% 개선)
  - Timeout 에러: 5% → 0%
  - 캐시 히트율: 78%
- **비즈니스 임팩트:**
  - 이탈률 감소로 매출 증대 월 5,000만원 기여
  - CS 문의 300% 감소
- **배운 점:**
  1. 측정 없는 최적화는 도박임을 깨달았습니다
  2. Redis는 정합성 vs 성능의 균형이 중요했습니다
  3. 팀과 함께 결정하고 책임지는(온콜) 기술을 선택해야 함을 배웠습니다
- **다시 한다면:**
  1. Cache Warming 전략을 초기부터 설계
  2. A/B 테스트로 10% 트래픽부터 점진적 배포"

## 평가 항목

### 필수 체크리스트
- [ ] **논리적 흐름**: 문제 → 대안 → 결정 → 구현 → 결과가 논리적으로 연결되는가?
- [ ] **문제 정의의 명확성**: 구체적인 수치와 비즈니스 임팩트가 있는가?
- [ ] **원인 분석**: 측정(Measure)을 통한 근거 기반 분석인가?
- [ ] **대안 비교**: 여러 선택지를 비교하고 장단점을 분석했는가?
- [ ] **비즈니스 가치**: 기술 선택이 고객/비즈니스 가치와 연결되는가?
- [ ] **팀 협업**: 팀과의 소통과 합의 과정이 있는가?
- [ ] **구현 디테일**: 구체적인 기술적 결정과 근거가 있는가?
- [ ] **문제 해결**: 구현 중 만난 문제와 해결 과정이 있는가?
- [ ] **측정 가능한 결과**: 구체적인 수치로 성과를 제시하는가?
- [ ] **회고와 학습**: 배운 점과 개선점을 제시하는가?

### 감점 요소
- ❌ "그냥 그런 것 같았다" - 측정 없는 추측
- ❌ "요즘 많이 쓰여서" - 비즈니스 가치 부재
- ❌ "배우고 싶어서" - RDD (Resume-driven Development)
- ❌ 논리적 비약 (원인과 해결책의 연결 고리 없음)
- ❌ 후속 문제 미고려 (트레이드오프 분석 없음)
- ❌ 모호한 표현 ("성능이 좋아졌다" 등 구체적 수치 없음)

## 평가 프로세스

1. **답변 분석**
   - 제공된 답변에서 5단계 각각의 요소가 있는지 확인
   - 각 단계별로 누락된 내용 파악
   - 논리적 흐름의 단절 지점 찾기

2. **점수 산정** (각 단계별 20점, 총 100점)
   - 1장 (문제의 발견): /20점
   - 2장 (선택지 탐색): /20점
   - 3장 (결정의 근거): /20점
   - 4장 (구현의 여정): /20점
   - 5장 (결과와 학습): /20점

3. **상세 피드백 작성**
   - 각 단계별 강점과 약점 지적
   - 구체적인 개선 방향 제시
   - 감점 요소 발견 시 명확히 지적

4. **정보 검색** (모범 답안 생성 시)
   - 인터넷 검색 우선: 잘 알려지지 않은 내용이나 최신 정보는 WebSearch를 먼저 사용
   - Context7 활용: 공식 문서, 라이브러리 사용법, 프레임워크 패턴은 Context7로 검색
   - 출처 표기 필수: 각 내용별로 반드시 출처 링크를 표기

## 출력 형식

### 모범 답변 작성 요구사항 (필수)

모범 답변은 **면접관에게 직접 말로 전달할 수 있는 완성된 답변**으로 작성해야 합니다:
- 플레이스홀더(`[내용]`)가 아닌 실제 내용이 채워진 답변
- 구체적인 수치(성능 개선율, 비용 절감액 등)와 문제 해결 과정 포함
- 출처 링크와 함께 기술적 주장 근거 제시
- 면접에서 바로 사용할 수 있는 자연스러운 문장 구성

평가 결과와 모범 답안을 `{원본파일명}-anki.md` 파일로 생성해줘.
